name: Deploy (CD)

# ============================================================
# CONTINUOUS DEPLOYMENT — Vercel
#
# Gate strategy: branch protection pada `main` mewajibkan SEMUA
# status checks hijau (Build, Quality, E2E, Security) SEBELUM merge.
# Jadi setiap push ke `main` sudah pasti lolos seluruh pipeline.
#
#   push ke main            → deploy production (atomic + rollback instan)
#   pull_request            → deploy preview (URL unik per PR)
#
# Environment "production" dilindungi manual approval (opsional,
# dikonfigurasi di GitHub → Settings → Environments).
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  # ---------------------------------------------------------------------------
  # Deploy production (target = main, sudah lolos seluruh CI gate).
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy Production (Vercel)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy ke Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

  # ---------------------------------------------------------------------------
  # Deploy preview (target = pull request).
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy Preview (Vercel)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy Preview ke Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ''
          working-directory: ./

      - name: Comment preview URL ke PR
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            🚀 **Preview deployment siap!**
            🔗 URL: ${{ steps.deploy.outputs.preview-url }}

# ============================================================
# CATATAN PENTING — env vars untuk Vercel:
#   Nilai NEXT_PUBLIC_FIREBASE_* dan FIREBASE_* (server) di-set di
#   Vercel Dashboard → Project → Settings → Environment Variables.
#   Vercel build membaca dari sana, BUKAN dari GitHub Actions env.
#   (GitHub Actions hanya menyediakan VERCEL_TOKEN/ORG_ID/PROJECT_ID
#   untuk autentikasi deploy, bukan nilai runtime aplikasi.)
# ============================================================
