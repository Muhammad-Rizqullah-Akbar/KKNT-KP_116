name: E2E (Playwright)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Setup Java (emulator dependency)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openjdk-17-jre-headless
      - name: Start Firebase emulator (background)
        run: |
          npx firebase-tools emulators:start --only firestore,auth --project desa-sehat-2026 &
          sleep 20
      - name: Seed test data to emulator
        run: |
          FIRESTORE_EMULATOR_HOST=localhost:8090 node scripts/migration/seed.mjs
      - name: Run Playwright tests
        run: npx playwright test
        env:
          FIREBASE_PROJECT_ID: desa-sehat-2026
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: desa-sehat-2026
          FIRESTORE_EMULATOR_HOST: localhost:8090
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          NEXT_PUBLIC_USE_EMULATOR: "true"
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-suites/results/playwright-report/
          retention-days: 14
